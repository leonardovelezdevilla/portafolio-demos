<!doctype html>
<html lang="es-PE">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Unbounded'; font-weight: 800; src: url('../public/fonts/unbounded-latin-800-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Bricolage Grotesque'; font-weight: 600; src: url('../public/fonts/bricolage-grotesque-latin-600-normal.woff2') format('woff2'); }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; background: #12110f; color: #f1ede3; font-family: 'Bricolage Grotesque'; position: relative; overflow: hidden; }
  .banda { position: absolute; right: -60px; top: 0; width: 360px; height: 630px; background: #c9f23b; transform: skewX(-8deg); }
  .logo { position: absolute; left: 72px; top: 56px; font: 800 44px 'Unbounded'; letter-spacing: -0.04em; }
  .logo span { color: #c9f23b; }
  h1 { position: absolute; left: 72px; top: 170px; font: 800 96px/1 'Unbounded'; letter-spacing: -0.035em; width: 900px; }
  h1 .t { text-decoration: line-through; text-decoration-color: #ff8a63; color: #b9b3a6; }
  h1 mark { background: #c9f23b; color: #12110f; padding: 0 10px; }
  p { position: absolute; left: 72px; bottom: 64px; font: 600 30px 'Bricolage Grotesque'; color: #f1ede3; }
  .ch { position: absolute; right: 90px; bottom: 64px; font: 800 20px 'Unbounded'; color: #12110f; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="banda"></div>
  <div class="logo">nexo<span>.</span></div>
  <h1><span class="t">Menos digitar.</span><br />Más <mark>vender.</mark></h1>
  <p>Automatización para pymes de Lima · Demo de portafolio</p>
  <div class="ch">WhatsApp · Sheets · Facturas</div>
</body>
</html>
